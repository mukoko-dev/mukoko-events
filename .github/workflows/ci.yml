name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  merge_group:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:eslint

      - name: Build
        run: npm run build
        env:
          WORKOS_CLIENT_ID: client_placeholder
          WORKOS_API_KEY: sk_placeholder
          WORKOS_COOKIE_PASSWORD: placeholder_cookie_password_at_least_32_chars
          WORKOS_REDIRECT_URI: https://example.com/callback
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  integration-tests:
    name: Integration Tests (real MongoDB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # mongodb-memory-server downloads a ~120MB mongod binary on first use.
      # Caching it keeps this job to roughly the cost of the unit suite; it is
      # also why these tests are a separate job rather than folded into
      # `test:run`, which must stay fast.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # The Mukoko Events MCP server (nyuchi/mukoko-events-mcp) and the Mukoko
  # Events Admin app (nyuchi/mukoko-events-admin) are now separate repos with
  # their own CI. This workflow covers the public Nhimbe app only.

  # NOTE: The "Run D1 Migrations" job was removed when the database moved to
  # MongoDB (the Mukoko v3.1 cluster). Collections, validators, and indexes are
  # owned by the nyuchi_platform_db project — this repo is a read/write consumer
  # only and has no migrations to run.
